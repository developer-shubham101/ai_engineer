<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#0a58ca"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Document -->
  <rect x="6" y="5" width="11" height="14" rx="1.5" fill="white" opacity="0.15"/>
  <rect x="6" y="5" width="11" height="14" rx="1.5" fill="none" stroke="white" stroke-width="1" opacity="0.55"/>
  <line x1="8.5" y1="9"    x2="14.5" y2="9"    stroke="white" stroke-width="1"   opacity="0.7" stroke-linecap="round"/>
  <line x1="8.5" y1="11.5" x2="14.5" y2="11.5" stroke="white" stroke-width="1"   opacity="0.7" stroke-linecap="round"/>
  <line x1="8.5" y1="14"   x2="12"   y2="14"   stroke="white" stroke-width="1"   opacity="0.7" stroke-linecap="round"/>

  <!-- Chat bubble -->
  <rect x="14" y="14" width="12" height="9" rx="2.5" fill="url(#bubble)"/>
  <polygon points="15.5,23 13.5,26.5 18,23" fill="url(#bubble)"/>
  <!-- Three dots -->
  <circle cx="17.5" cy="18.5" r="1.1" fill="#0d6efd"/>
  <circle cx="20"   cy="18.5" r="1.1" fill="#0d6efd"/>
  <circle cx="22.5" cy="18.5" r="1.1" fill="#0d6efd"/>
</svg>
