debate_advocate_task:
  description: "Present 3-4 compelling arguments in favor of: {topic}. Provide factual evidence and logical reasoning to support your position."
  expected_output: "A well-structured argument with 3-4 key points supporting the topic, each backed by reasoning or evidence."
  agent: debate_advocate

debate_critic_task:
  description: "Present 3-4 strong counterarguments against: {topic}. Challenge the opposing position with critical analysis and alternative perspectives."
  expected_output: "A well-structured counterargument with 3-4 key points opposing the topic, each backed by critical analysis."
  agent: debate_critic

debate_moderator_task:
  description: "Analyze both the advocate and critic positions on: {topic}. Provide a balanced synthesis highlighting key points from both sides and suggest a nuanced conclusion."
  expected_output: "A balanced analysis that fairly represents both positions and provides a thoughtful, nuanced conclusion."
  agent: debate_moderator

research_task:
  description: "Conduct comprehensive research on: {topic}. Gather key facts, current trends, statistics, and expert opinions."
  expected_output: "A comprehensive research summary with facts, trends, statistics, and expert opinions organized in clear sections."
  agent: researcher

analysis_task:
  description: "Analyze the research findings on: {topic}. Identify patterns, connections, implications, and any gaps in the data."
  expected_output: "A detailed analysis identifying patterns, implications, and insights from the research data."
  agent: analyst

synthesis_task:
  description: "Create a comprehensive report on: {topic} combining research findings and analytical insights into a well-structured document."
  expected_output: "A professional report with executive summary, key findings, analysis, and recommendations."
  agent: synthesizer

tool_selector_task:
  description: "Analyse this user query and determine the best approach to answer it: {topic}. Identify what information is needed and outline a clear plan."
  expected_output: "A concise plan describing the intent of the query and the steps needed to answer it accurately."
  agent: tool_selector

assistant_summarizer_task:
  description: "Using the plan and findings from the tool selector, provide a clear, complete, and well-formatted answer to: {topic}"
  expected_output: "A clear, concise, and well-formatted answer that directly addresses the user's question."
  agent: assistant_summarizer

prompt_parser_task:
  description: "Parse the following prompt and extract its structural components: {topic}. Identify intent, variables, constraints, role framing, and missing context."
  expected_output: "A bullet-point breakdown of the prompt's intent, variables, constraints, role framing, and missing context."
  agent: prompt_parser

criteria_judge_task:
  description: "Evaluate the following prompt on 5 criteria (Clarity, Specificity, Context, Safety, Token Efficiency, scored 0-10): {topic}. List all concrete issues found."
  expected_output: "A JSON object with scores for each criterion, an overall score, and a list of specific issues found."
  agent: criteria_judge

prompt_improver_task:
  description: "Rewrite the following prompt to fix all issues identified by the judge, preserving the original intent: {topic}"
  expected_output: "The improved prompt followed by a bullet list of changes made."
  agent: prompt_improver

eval_reporter_task:
  description: "Assemble a complete prompt evaluation report for: {topic}. Use all outputs from the parser, judge, and improver."
  expected_output: "A structured markdown report with sections: Original Prompt, Parsed Structure, Scores table, Issues Found, Improved Prompt, Changes Made, Verdict."
  agent: eval_reporter